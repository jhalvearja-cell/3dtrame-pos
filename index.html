<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Trame POS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para compilar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; }
        /* Ocultar flechas en inputs numéricos */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .animate-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- CONFIGURACIÓN CRÍTICA ---
        // ¡PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT!
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwQD6xsrfp2Ej1ZiYh9QhQyp0-saEwd02_sTYcAoFWndrCJyeOqfycMig4tU_9pgShf/exec';

        // --- CONFIGURACIÓN LOGÍSTICA ---
        const DESTINOS = {
            'A': { nombre: 'Quito / Valles (Local)', costoBase: 2.59, costoKiloExtra: 1.20 },
            'B': { nombre: 'Provincias (Regional)', costoBase: 5.92, costoKiloExtra: 1.20 },
            'C': { nombre: 'Provincias Especiales', costoBase: 7.02, costoKiloExtra: 1.50 },
            'D': { nombre: 'Galápagos', costoBase: 12.94, costoKiloExtra: 3.00 },
            'E': { nombre: 'Retiro en Taller', costoBase: 0.00, costoKiloExtra: 0.00 }
        };

        const obtenerPrecioUnitario = (tipo, cantidadTotalCarrito) => {
            if (tipo === 'HS') {
                if (cantidadTotalCarrito >= 4) return 20.00;
                if (cantidadTotalCarrito >= 2) return 22.00;
                return 24.00;
            } else {
                if (cantidadTotalCarrito >= 4) return 18.00;
                if (cantidadTotalCarrito >= 2) return 20.00;
                return 22.00;
            }
        };

        // Componentes de Íconos simples (SVGs inlines para evitar fallos de dependencias)
        const IconLock = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>;
        const IconLoader = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="animate-spin"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>;
        const IconCart = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>;
        const IconPlus = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const IconTrash = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;
        const IconDownload = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>;
        const IconPackage = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"></line><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>;
        const IconRefresh = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>;

        function App() {
            // --- ESTADOS GLOBALES ---
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [pin, setPin] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [statusMessage, setStatusMessage] = useState('');
            const [activeTab, setActiveTab] = useState('vender');
            
            // --- ESTADOS DE INVENTARIO ---
            const [inventario, setInventario] = useState([]);
            const [cargandoInventario, setCargandoInventario] = useState(false);

            // --- 1. AUTENTICACIÓN ---
            const handleLogin = async (e) => {
                e.preventDefault();
                if (!pin) return;
                
                setIsLoading(true);
                setStatusMessage('Verificando PIN...');

                try {
                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'get_inventory', pin: pin })
                    });
                    
                    const result = await response.json();
                    
                    if (result.status === 'success') {
                        setIsAuthenticated(true);
                        setInventario(result.data);
                        setStatusMessage('');
                    } else {
                        setStatusMessage(result.message || 'PIN Incorrecto');
                    }
                } catch (error) {
                    setStatusMessage('Error de red. Verifica la URL de Google Script.');
                } finally {
                    setIsLoading(false);
                }
            };

            const recargarInventario = async () => {
                setCargandoInventario(true);
                try {
                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'get_inventory', pin: pin })
                    });
                    const result = await response.json();
                    if (result.status === 'success') {
                        setInventario(result.data);
                    }
                } catch (error) {
                    console.error('Error recargando', error);
                } finally {
                    setCargandoInventario(false);
                }
            };

            // --- PANTALLA LOGIN ---
            if (!isAuthenticated) {
                return (
                    <div className="min-h-screen bg-slate-900 flex flex-col items-center justify-center p-6 font-sans">
                        <div className="w-full max-w-sm bg-white rounded-3xl shadow-2xl p-8 relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-2 bg-blue-600"></div>
                            <div className="text-center mb-8">
                                <div className="w-16 h-16 bg-blue-100 rounded-2xl mx-auto flex items-center justify-center mb-4">
                                    <IconLock />
                                </div>
                                <h1 className="text-2xl font-black text-slate-800 tracking-tight">3D TRAME POS</h1>
                                <p className="text-sm text-slate-500 font-medium mt-1">Acceso Operativo Requerido</p>
                            </div>

                            <form onSubmit={handleLogin} className="space-y-6">
                                <div>
                                    <input 
                                        type="password" 
                                        inputMode="numeric"
                                        maxLength="4"
                                        placeholder="Ingresa PIN"
                                        className="w-full bg-slate-50 border-2 border-slate-200 text-slate-800 rounded-xl p-4 text-center text-2xl font-black tracking-[0.5em] focus:border-blue-500 outline-none"
                                        value={pin}
                                        onChange={e => setPin(e.target.value)}
                                    />
                                </div>
                                {statusMessage && <p className="text-center text-sm font-bold text-red-500 bg-red-50 p-3 rounded-lg">{statusMessage}</p>}
                                <button type="submit" disabled={isLoading || pin.length < 4} className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-blue-700 disabled:opacity-50 flex justify-center items-center">
                                    {isLoading ? <IconLoader /> : 'DESBLOQUEAR'}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            // --- MÓDULO VENTAS ---
            const VenderForm = () => {
                const [cart, setCart] = useState([]);
                const [itemInput, setItemInput] = useState({ sku: inventario.length > 0 ? inventario[0].sku : '', cantidad: 1 });
                const [formData, setFormData] = useState({ destino: 'A', pvpCobrado: 0, cobroEnvio: 0, ajusteManual: '' });
                const [isSubmitting, setIsSubmitting] = useState(false);

                const qtyTotalCarrito = cart.reduce((sum, item) => sum + item.cantidad, 0);
                
                const cartConPrecios = cart.map(item => {
                    const prod = inventario.find(p => p.sku === item.sku);
                    const precioUnitario = obtenerPrecioUnitario(prod.tipo, qtyTotalCarrito);
                    return {
                        ...item, nombre: prod.nombre, tipo: prod.tipo, precioUnitario,
                        subtotal: precioUnitario * item.cantidad,
                        costoInterno: (prod.cpp || 13.98) * item.cantidad
                    };
                });

                const pvpSugeridoTotal = cartConPrecios.reduce((sum, item) => sum + item.subtotal, 0);
                const costoProductosTotal = cartConPrecios.reduce((sum, item) => sum + item.costoInterno, 0);

                useEffect(() => {
                    const destinoInfo = DESTINOS[formData.destino];
                    let nuevoCobroEnvio = 0;
                    if (qtyTotalCarrito > 0) {
                        if (formData.destino === 'A' || formData.destino === 'E') {
                            nuevoCobroEnvio = 0;
                        } else if (formData.destino === 'D') {
                            const kilosExtra = qtyTotalCarrito > 2 ? (qtyTotalCarrito - 2) : 0;
                            nuevoCobroEnvio = destinoInfo.costoBase + (kilosExtra * destinoInfo.costoKiloExtra);
                        } else {
                            if (qtyTotalCarrito >= 4) nuevoCobroEnvio = 3.99;
                            else {
                                const kilosExtra = qtyTotalCarrito > 2 ? (qtyTotalCarrito - 2) : 0;
                                nuevoCobroEnvio = destinoInfo.costoBase + (kilosExtra * destinoInfo.costoKiloExtra);
                            }
                        }
                    }
                    setFormData(prev => ({ ...prev, pvpCobrado: pvpSugeridoTotal.toFixed(2), cobroEnvio: nuevoCobroEnvio.toFixed(2) }));
                }, [qtyTotalCarrito, formData.destino, pvpSugeridoTotal]);

                const destinoInfo = DESTINOS[formData.destino];
                const kilosExtraReales = qtyTotalCarrito > 2 ? (qtyTotalCarrito - 2) : 0;
                const costoEnvioRealCalculado = qtyTotalCarrito > 0 ? destinoInfo.costoBase + (kilosExtraReales * destinoInfo.costoKiloExtra) : 0;
                const costoEnvioReal = formData.ajusteManual !== '' ? parseFloat(formData.ajusteManual) : costoEnvioRealCalculado;
                
                const ingresoTotalPrev = parseFloat(formData.pvpCobrado || 0) + parseFloat(formData.cobroEnvio || 0);
                const egresoTotalPrev = costoEnvioReal + costoProductosTotal;
                const profitPrev = ingresoTotalPrev - egresoTotalPrev;

                const agregarAlCarrito = () => {
                    const qty = parseInt(itemInput.cantidad);
                    if (qty <= 0 || !itemInput.sku) return;
                    const prodInventario = inventario.find(p => p.sku === itemInput.sku);
                    const indexExistente = cart.findIndex(i => i.sku === itemInput.sku);
                    let qtyAValidar = qty + (indexExistente >= 0 ? cart[indexExistente].cantidad : 0);
                    
                    if (prodInventario.stockActual < qtyAValidar) {
                        alert(`Stock insuficiente. Quedan ${prodInventario.stockActual}.`);
                        return;
                    }

                    if (indexExistente >= 0) {
                        const nuevoCart = [...cart];
                        nuevoCart[indexExistente].cantidad += qty;
                        setCart(nuevoCart);
                    } else setCart([...cart, { sku: itemInput.sku, cantidad: qty }]);
                    
                    setItemInput(prev => ({ ...prev, cantidad: 1 }));
                };

                const handleSubmitVenta = async (e) => {
                    e.preventDefault();
                    if (cart.length === 0) return;
                    setIsSubmitting(true);

                    const resumenItems = cartConPrecios.map(item => `${item.cantidad}x ${item.nombre}`).join(' | ');
                    const payloadVenta = {
                        id: `VNT-${Date.now()}`, fecha: new Date().toLocaleString(),
                        items: cartConPrecios.map(i => ({ sku: i.sku, cantidad: i.cantidad })),
                        resumenItems, pvpCobrado: parseFloat(formData.pvpCobrado),
                        cobroEnvio: parseFloat(formData.cobroEnvio), destinoNombre: DESTINOS[formData.destino].nombre,
                        costoEnvioFinal: costoEnvioReal, costoProductoTotal: costoProductosTotal,
                        utilidadNeta: profitPrev, cantidadTotal: qtyTotalCarrito
                    };

                    try {
                        const response = await fetch(GOOGLE_SCRIPT_URL, {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'registrar_venta', pin: pin, payload: payloadVenta })
                        });
                        const result = await response.json();
                        if (result.status === 'success') {
                            alert('¡Venta registrada!');
                            setCart([]);
                            setFormData({ destino: 'A', pvpCobrado: 0, cobroEnvio: 0, ajusteManual: '' });
                            recargarInventario();
                        } else alert('Error: ' + result.message);
                    } catch (error) {
                        alert('Error de conexión.');
                    } finally { setIsSubmitting(false); }
                };

                if (inventario.length === 0) return <div className="p-10 text-center text-slate-500 font-bold">Inventario vacío.</div>;

                return (
                    <div className="p-4 animate-in fade-in pb-24">
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 mb-4">
                            <h2 className="text-lg font-bold text-slate-800 mb-4 flex items-center"><IconCart /> Armar Pedido</h2>
                            <div className="flex gap-3 mb-2">
                                <div className="flex-1">
                                    <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Producto</label>
                                    <select className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none" value={itemInput.sku} onChange={e => setItemInput({...itemInput, sku: e.target.value})}>
                                        {inventario.map(p => <option key={p.sku} value={p.sku}>{p.nombre} ({p.stockActual})</option>)}
                                    </select>
                                </div>
                                <div className="w-20">
                                    <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Cant.</label>
                                    <input type="number" min="1" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-bold text-center outline-none" value={itemInput.cantidad} onChange={e => setItemInput({...itemInput, cantidad: e.target.value})} />
                                </div>
                            </div>
                            <button type="button" onClick={agregarAlCarrito} className="w-full mt-2 bg-blue-50 text-blue-700 font-bold py-3 rounded-xl flex justify-center items-center text-sm"><IconPlus /> Añadir</button>
                        </div>

                        {cart.length > 0 && (
                            <form onSubmit={handleSubmitVenta}>
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 mb-4">
                                    <h3 className="text-sm font-bold text-slate-800 uppercase mb-3">Carrito ({qtyTotalCarrito} rollos)</h3>
                                    <div className="space-y-2 mb-4">
                                        {cartConPrecios.map((item, idx) => (
                                            <div key={idx} className="flex justify-between items-center p-3 bg-slate-50 rounded-xl border border-slate-100">
                                                <div className="flex-1">
                                                    <p className="text-sm font-bold text-slate-800">{item.nombre}</p>
                                                    <p className="text-xs text-emerald-600">{item.cantidad}x ${item.precioUnitario.toFixed(2)}</p>
                                                </div>
                                                <div className="flex items-center gap-3">
                                                    <p className="text-sm font-black text-slate-800">${item.subtotal.toFixed(2)}</p>
                                                    <button type="button" onClick={() => setCart(cart.filter(i => i.sku !== item.sku))} className="text-slate-400"><IconTrash /></button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="border-t border-slate-100 pt-4 space-y-4">
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Destino</label>
                                            <select className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none" value={formData.destino} onChange={e => setFormData({...formData, destino: e.target.value})}>
                                                {Object.entries(DESTINOS).map(([key, val]) => <option key={key} value={key}>{val.nombre}</option>)}
                                            </select>
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Cobro Productos</label>
                                                <input type="number" step="0.01" required className="w-full bg-blue-50 border border-blue-200 rounded-xl p-3 text-sm font-bold outline-none" value={formData.pvpCobrado} onChange={e => setFormData({...formData, pvpCobrado: e.target.value})} />
                                            </div>
                                            <div>
                                                <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Cobro Envío (Cliente)</label>
                                                <input type="number" step="0.01" required className="w-full bg-amber-50 border border-amber-200 rounded-xl p-3 text-sm font-bold outline-none" value={formData.cobroEnvio} onChange={e => setFormData({...formData, cobroEnvio: e.target.value})} />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold text-slate-400 uppercase mb-1 flex justify-between"><span>Costo Envío Real</span><span>(Est: ${costoEnvioRealCalculado.toFixed(2)})</span></label>
                                            <input type="number" step="0.01" placeholder={`Vacío = $${costoEnvioRealCalculado.toFixed(2)}`} className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none" value={formData.ajusteManual} onChange={e => setFormData({...formData, ajusteManual: e.target.value})} />
                                        </div>
                                    </div>

                                    <div className="mt-5 bg-slate-900 rounded-2xl p-5 shadow-lg text-white">
                                        <div className="flex justify-between items-end border-b border-slate-700 pb-3 mb-3">
                                            <div><span className="text-[10px] text-slate-400 uppercase font-bold">Total a cobrar</span><h3 className="text-3xl font-black text-emerald-400 mt-1">${ingresoTotalPrev.toFixed(2)}</h3></div>
                                        </div>
                                        <div className="flex justify-between items-center bg-slate-800 p-3 rounded-xl border border-slate-700/50">
                                            <span className="text-xs text-slate-400 font-bold uppercase">Profit</span><span className="text-xl font-black text-emerald-400">${profitPrev.toFixed(2)}</span>
                                        </div>
                                    </div>

                                    <button type="submit" disabled={isSubmitting} className="w-full mt-4 bg-emerald-600 text-white font-black py-4 rounded-xl shadow-lg flex justify-center items-center">
                                        {isSubmitting ? <IconLoader /> : 'Aprobar Venta'}
                                    </button>
                                </div>
                            </form>
                        )}
                    </div>
                );
            };

            // --- MÓDULO COMPRAS ---
            const ComprasForm = () => {
                const [compraData, setCompraData] = useState({ esNuevo: false, sku: inventario.length > 0 ? inventario[0].sku : '', nuevoSKU: '', nuevoNombre: '', nuevoTipo: 'HS', cantidad: '', costoFactura: '' });
                const [isSubmitting, setIsSubmitting] = useState(false);

                const handleSubmitCompra = async (e) => {
                    e.preventDefault();
                    setIsSubmitting(true);
                    
                    const skuFinal = compraData.esNuevo ? compraData.nuevoSKU : compraData.sku;
                    const nombreFinal = compraData.esNuevo ? compraData.nuevoNombre : inventario.find(i => i.sku === compraData.sku)?.nombre;
                    const tipoFinal = compraData.esNuevo ? compraData.nuevoTipo : inventario.find(i => i.sku === compraData.sku)?.tipo;

                    const payloadCompra = {
                        id: `CMP-${Date.now()}`, fecha: new Date().toLocaleDateString(),
                        resumenItems: `${compraData.cantidad}x ${nombreFinal}`,
                        cantidadTotal: parseInt(compraData.cantidad), costoFactura: parseFloat(compraData.costoFactura),
                        items: [{ sku: skuFinal, nombre: nombreFinal, tipo: tipoFinal, cantidad: parseInt(compraData.cantidad) }]
                    };

                    try {
                        const response = await fetch(GOOGLE_SCRIPT_URL, {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ action: 'registrar_compra', pin: pin, payload: payloadCompra })
                        });
                        const result = await response.json();
                        if (result.status === 'success') {
                            alert('Stock ingresado!');
                            setCompraData({ ...compraData, cantidad: '', costoFactura: '', nuevoSKU: '', nuevoNombre: '' });
                            recargarInventario();
                        } else alert('Error: ' + result.message);
                    } catch (error) { alert('Error de conexión.'); } 
                    finally { setIsSubmitting(false); }
                };

                return (
                    <div className="p-4 animate-in fade-in pb-24">
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-5">
                            <h2 className="text-lg font-bold text-slate-800 mb-4 flex items-center"><IconDownload /> Registrar Factura</h2>
                            <div className="flex bg-slate-100 p-1 rounded-xl mb-6">
                                <button type="button" className={`flex-1 py-2 text-xs font-bold rounded-lg ${!compraData.esNuevo ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500'}`} onClick={() => setCompraData({...compraData, esNuevo: false})}>Re-Stock</button>
                                <button type="button" className={`flex-1 py-2 text-xs font-bold rounded-lg ${compraData.esNuevo ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500'}`} onClick={() => setCompraData({...compraData, esNuevo: true})}>Nuevo Producto</button>
                            </div>
                            <form onSubmit={handleSubmitCompra} className="space-y-4">
                                {!compraData.esNuevo ? (
                                    <div><label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Producto</label>
                                    <select className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none" value={compraData.sku} onChange={e => setCompraData({...compraData, sku: e.target.value})}>
                                        {inventario.map(p => <option key={p.sku} value={p.sku}>{p.nombre} (Stock: {p.stockActual})</option>)}
                                    </select></div>
                                ) : (
                                    <div className="space-y-3 bg-indigo-50 p-4 rounded-xl">
                                        <div><label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">SKU</label><input type="text" required className="w-full bg-white border border-slate-200 rounded-xl p-3 text-sm outline-none" value={compraData.nuevoSKU} onChange={e => setCompraData({...compraData, nuevoSKU: e.target.value})} /></div>
                                        <div><label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">Nombre</label><input type="text" required className="w-full bg-white border border-slate-200 rounded-xl p-3 text-sm outline-none" value={compraData.nuevoNombre} onChange={e => setCompraData({...compraData, nuevoNombre: e.target.value})} /></div>
                                        <div><label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">Tipo</label>
                                        <select className="w-full bg-white border border-slate-200 rounded-xl p-3 text-sm outline-none" value={compraData.nuevoTipo} onChange={e => setCompraData({...compraData, nuevoTipo: e.target.value})}>
                                            <option value="HS">High Speed (HS)</option><option value="STD">Estándar (STD)</option>
                                        </select></div>
                                    </div>
                                )}
                                <div className="grid grid-cols-2 gap-3 pt-2">
                                    <div><label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Cant.</label><input type="number" required min="1" className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none" value={compraData.cantidad} onChange={e => setCompraData({...compraData, cantidad: e.target.value})} /></div>
                                    <div><label className="block text-[10px] font-bold text-slate-400 uppercase mb-1">Costo Total ($)</label><input type="number" step="0.01" required className="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm outline-none" value={compraData.costoFactura} onChange={e => setCompraData({...compraData, costoFactura: e.target.value})} /></div>
                                </div>
                                <button type="submit" disabled={isSubmitting} className="w-full bg-indigo-600 text-white font-black py-4 rounded-xl shadow-lg flex justify-center items-center">
                                    {isSubmitting ? <IconLoader /> : 'Ingresar Stock'}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            };

            // --- MÓDULO STOCK ---
            const StockTab = () => (
                <div className="p-4 animate-in fade-in pb-24">
                    <div className="flex justify-between items-center mb-4">
                        <h2 className="text-lg font-bold text-slate-800 flex items-center"><IconPackage /> Inventario</h2>
                        <button onClick={recargarInventario} className="p-2 bg-slate-200 rounded-full"><IconRefresh /></button>
                    </div>
                    <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                        <div className="divide-y divide-slate-50">
                            {inventario.length === 0 ? <p className="p-6 text-center text-slate-400">Inventario vacío.</p> : inventario.map(prod => (
                                <div key={prod.sku} className="p-4 flex justify-between items-center">
                                    <div className="flex items-center space-x-3">
                                        <div className={`w-2 h-2 rounded-full ${prod.stockActual <= 2 ? 'bg-red-500' : 'bg-emerald-500'}`}></div>
                                        <div>
                                            <p className="text-sm font-semibold text-slate-800">{prod.nombre}</p>
                                            <p className="text-[10px] text-slate-400">ID: {prod.sku} | Costo: ${prod.cpp.toFixed(2)}</p>
                                        </div>
                                    </div>
                                    <p className="text-xl font-black text-slate-800">{prod.stockActual}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="min-h-screen bg-slate-50 max-w-md mx-auto relative shadow-2xl flex flex-col">
                    <header className="bg-slate-900 text-white p-5 rounded-b-3xl z-10 flex justify-between items-center">
                        <h1 className="text-2xl font-black tracking-tight">3D TRAME</h1>
                        <button onClick={() => { setIsAuthenticated(false); setPin(''); }} className="bg-red-500/10 text-red-400 px-3 py-1.5 rounded-lg text-xs font-bold border border-red-500/20">SALIR</button>
                    </header>
                    <main className="flex-1 overflow-y-auto relative">
                        {activeTab === 'vender' && <VenderForm />}
                        {activeTab === 'compras' && <ComprasForm />}
                        {activeTab === 'stock' && <StockTab />}
                    </main>
                    <nav className="fixed bottom-0 w-full max-w-md bg-white border-t border-slate-200 shadow-[0_-20px_40px_rgba(0,0,0,0.08)] px-6 py-3 flex justify-between items-center z-20 pb-safe">
                        <button onClick={() => setActiveTab('vender')} className={`flex flex-col items-center space-y-1 ${activeTab === 'vender' ? 'text-blue-600' : 'text-slate-400'}`}><IconCart /><span className="text-[10px] font-bold">POS</span></button>
                        <button onClick={() => setActiveTab('compras')} className={`flex flex-col items-center space-y-1 ${activeTab === 'compras' ? 'text-indigo-600' : 'text-slate-400'}`}><IconDownload /><span className="text-[10px] font-bold">Restock</span></button>
                        <button onClick={() => setActiveTab('stock')} className={`flex flex-col items-center space-y-1 ${activeTab === 'stock' ? 'text-blue-600' : 'text-slate-400'}`}><IconPackage /><span className="text-[10px] font-bold">Stock</span></button>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
